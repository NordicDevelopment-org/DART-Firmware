; NDI 1 W LoRa radio, Rev A0: chip-down nRF52840 + SX1262 + SKY66122-11 1 W front end.
;
; Overlay for upstream meshtastic/firmware: ndi_1w/ci/build_variant.sh copies this folder to
; variants/nrf52840/ndi_1w/ in a checkout of the pinned release tag and applies ndi_1w/meshtastic/patches/.
; The env pattern follows upstream variants/nrf52840/rak3401_1watt/platformio.ini.
; variant.h, ndi_pin_init.inc and ndi_forbidden_guard.h are GENERATED (ndi_1w/pin_table/gen_variant.py).
[env:ndi_1w]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = false
custom_meshtastic_display_name = NDI 1 W Radio Rev A0
custom_meshtastic_tags = NDI
custom_meshtastic_requires_dfu = true

extends = nrf52840_base
; The wiscore_rak4631 board JSON gives the app layout (S140 6.1.1, app at 0x26000). A blank chip also needs
; MBR + SoftDevice + bootloader (M3). NDI needs its own USB product ID before any shipped unit.
board = wiscore_rak4631
build_type = release
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/ndi_1w
  ; Hardware model 255. Neither RAK4630 nor RAK3401 may be defined (forbidden_macros.txt).
  -D PRIVATE_HW
  ; P0.09 (user button) and P0.10 (amplifier mode) are NFC pins; P0.18 is nRESET: UICR words.
  -D CONFIG_NFCT_PINS_AS_GPIOS=1
  -D CONFIG_GPIO_AS_PINRESET=1
  ; REG1 DC/DC (hardware present, stock never enables it). Set to 0 to run in LDO mode.
  -D NDI_ENABLE_REG1_DCDC=1
  ; Never probe the BQ25856-Q1 charger (0x6B) or the IMU footprint (0x6A): patch 0001 plus the
  ; accelerometer exclusion (the LSM6DS3 path would write registers at 0x6A or 0x6B).
  -D NDI_I2C_SKIP_CHARGER_IMU=1
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/ndi_1w> +<mesh/api/>
lib_deps =
  ${nrf52840_base.lib_deps}
  ${networking_base.lib_deps}

; If not set, upload goes over serial through the bootloader (1200 bps touch). The first flash of a blank
; board is over SWD (Tag-Connect J12) and needs MBR + SoftDevice + bootloader: see ndi_1w/docs/BRINGUP.md (M3).
;upload_protocol = jlink
